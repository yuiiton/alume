<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#171717">
  <title>Alume — Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root{--bg:#000;--surface:#101010;--white:#fff;--green:#16a34a;--yellow:#eab308;--red:#dc2626;--blue:#2563eb;--muted:#9b9b9b;--line:#343434}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:224px 1fr}.side{border-right:1px solid #252525;padding:28px 16px;display:flex;flex-direction:column;gap:34px;background:#090909}.brand{display:flex;align-items:center;gap:10px;color:white;text-decoration:none;font-size:1.15rem;font-weight:700;letter-spacing:-.04em}.brand-icon{display:grid;place-items:center;background:white;color:#171717;width:33px;height:33px;border-radius:9px}.nav-title{color:#777;text-transform:uppercase;font-size:.66rem;letter-spacing:.12em;padding:0 11px;margin-bottom:8px}.side .nav-link{color:#aaa;border-radius:9px;display:flex;align-items:center;gap:11px;padding:11px;font-size:.87rem}.side .nav-link:hover,.side .nav-link.active{color:#fff;background:#1d1d1d}.side .nav-link.active{box-shadow:inset 2px 0 var(--green)}main{padding:40px clamp(20px,5vw,66px)}.canvas{max-width:1040px;margin:0 auto}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px}.heading h1{font-size:1.85rem;letter-spacing:-.05em;margin:0;font-weight:600}.subtle{color:var(--muted);font-size:.87rem;margin-top:5px}.hello{font-size:1.15rem;font-weight:500;margin-bottom:24px}.overview{display:flex;gap:64px;margin-bottom:27px}.stat-label{color:#aaa;font-size:.85rem}.stat-value{margin-top:5px;font-size:1.18rem;font-weight:650}.stat-value.green{color:var(--green)}.cards{display:grid;gap:16px}.course{border:1px solid #e7e7e7;border-radius:21px;padding:17px 19px 14px;background:#000}.course-head{display:flex;align-items:center;gap:10px}.course h2{font-size:.96rem;font-weight:550;margin:0}.badge-state{font-size:.68rem;border:1px solid currentColor;border-radius:5px;padding:4px 9px;line-height:1.1}.stable{color:var(--green)}.risk{color:var(--yellow)}.critical{color:var(--red)}.percent{margin-left:auto;font-size:1.35rem;font-weight:600}.frequency-label{font-size:.69rem;color:#c5c5c5;margin:5px 0 6px}.progress{height:6px;border-radius:0;background:#343434}.progress-bar{background:var(--green)}.progress-bar.risk{background:var(--yellow)}.progress-bar.critical{background:var(--red)}.course-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:.73rem}.detail{color:white;text-decoration:none}.detail:hover{color:#bbb}.mobile-nav{display:none}
    @media(max-width:760px){.app{display:block}main{padding:28px 17px 91px}.side{position:fixed;z-index:3;left:0;right:0;bottom:0;height:68px;border:0;border-top:1px solid #292929;padding:6px 10px;display:block}.brand,.nav-title{display:none}.side nav{height:100%;display:flex;justify-content:space-around;align-items:center}.side .nav-link{display:grid;justify-items:center;gap:2px;font-size:.64rem;padding:7px 12px}.side .nav-link.active{box-shadow:inset 0 2px var(--green)}.heading{margin-bottom:28px}.heading h1{font-size:1.55rem}.overview{gap:48px}.course{padding:15px;border-radius:17px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side" aria-label="Navegação principal"><a class="brand" href="index.html"><span class="brand-icon"><i class="bi bi-mortarboard-fill"></i></span>alume</a><nav><div class="nav-title">Menu</div><a class="nav-link active" href="index.html" aria-current="page"><i class="bi bi-grid-1x2"></i><span>Dashboard</span></a><a class="nav-link" href="agenda.html"><i class="bi bi-calendar3"></i><span>Minha agenda</span></a><a class="nav-link" href="login.html"><i class="bi bi-box-arrow-in-right"></i><span>Login</span></a></nav></aside>
    <main><div class="canvas"><header class="heading"><div><div class="subtle">ALUME</div><h1>Dashboard</h1></div></header><p class="hello">Olá, estudante!</p><section class="overview" aria-label="Resumo"><div><div class="stat-label">Frequência geral</div><div class="stat-value green">90%</div></div><div><div class="stat-label">Disciplinas</div><div class="stat-value">3</div></div></section>
      <section class="cards" aria-label="Frequência por disciplina">
        <article class="course"><div class="course-head"><h2>Lógica de programação</h2><span class="badge-state stable">Estável</span><span class="percent stable">92%</span></div><div class="frequency-label">Frequência</div><div class="progress" role="progressbar" aria-label="Frequência em Lógica de programação" aria-valuenow="92" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" style="width:92%"></div></div><div class="course-bottom"><span>4 faltas</span><a class="detail" href="detalhamento.html">Ver detalhes <i class="bi bi-chevron-right"></i></a></div></article>
        <article class="course"><div class="course-head"><h2>Administração</h2><span class="badge-state risk">Em risco</span><span class="percent risk">85%</span></div><div class="frequency-label">Frequência</div><div class="progress" role="progressbar" aria-label="Frequência em Administração" aria-valuenow="85" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar risk" style="width:85%"></div></div><div class="course-bottom"><span>8 faltas</span><a class="detail" href="detalhamento.html">Ver detalhes <i class="bi bi-chevron-right"></i></a></div></article>
        <article class="course"><div class="course-head"><h2>Banco de dados</h2><span class="badge-state critical">Crítico</span><span class="percent critical">76%</span></div><div class="frequency-label">Frequência</div><div class="progress" role="progressbar" aria-label="Frequência em Banco de dados" aria-valuenow="76" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar critical" style="width:76%"></div></div><div class="course-bottom"><span>16 faltas</span><a class="detail" href="detalhamento.html">Ver detalhes <i class="bi bi-chevron-right"></i></a></div></article>
      </section></div></main>
  </div>
</body>
</html>
