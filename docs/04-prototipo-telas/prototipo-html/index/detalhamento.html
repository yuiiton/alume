<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#171717">
  <title>Alume — Detalhamento de frequência</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root{--green:#16a34a;--line:#eee}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:224px 1fr}.side{border-right:1px solid #252525;padding:28px 16px;display:flex;flex-direction:column;gap:34px;background:#090909}.brand{display:flex;align-items:center;gap:10px;color:white;text-decoration:none;font-size:1.15rem;font-weight:700;letter-spacing:-.04em}.brand-icon{display:grid;place-items:center;background:white;color:#171717;width:33px;height:33px;border-radius:9px}.side .nav-link{color:#aaa;border-radius:9px;display:flex;align-items:center;gap:11px;padding:11px;font-size:.87rem}.side .nav-link:hover,.side .nav-link.active{color:#fff;background:#1d1d1d}.side .nav-link.active{box-shadow:inset 2px 0 var(--green)}.nav-title{color:#777;text-transform:uppercase;font-size:.66rem;letter-spacing:.12em;padding:0 11px;margin-bottom:8px}main{padding:clamp(22px,5vw,58px)}.detail-card{max-width:1000px;min-height:570px;border:1px solid var(--line);border-radius:28px;margin:auto;padding:30px clamp(20px,5vw,60px)}.back{color:#fff;text-decoration:none;font-size:.9rem}.back:hover{color:#bbb}.course-title{font-size:1.85rem;font-weight:600;letter-spacing:-.04em;margin:18px 0 4px}.subtitle{color:#bbb}.percent{text-align:center;padding:70px 0 24px}.percent strong{display:block;color:var(--green);font-size:3rem;line-height:1.1}.percent span{font-size:1.05rem}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.metric{border:1px solid #eee;border-radius:20px;padding:18px 20px;min-height:98px}.metric span{display:block;font-size:.9rem}.metric strong{display:block;font-size:1.7rem;margin-top:7px}
    @media(max-width:760px){.app{display:block}main{padding:18px 12px 88px}.side{position:fixed;z-index:3;left:0;right:0;bottom:0;height:68px;border:0;border-top:1px solid #292929;padding:6px 10px;display:block}.brand,.nav-title{display:none}.side nav{height:100%;display:flex;justify-content:space-around;align-items:center}.side .nav-link{display:grid;justify-items:center;gap:2px;font-size:.64rem;padding:7px 12px}.side .nav-link.active{box-shadow:inset 0 2px var(--green)}.detail-card{min-height:calc(100vh - 120px);border-radius:21px;padding:24px 18px}.course-title{font-size:1.55rem}.percent{padding:58px 0 25px}.metrics{grid-template-columns:1fr;gap:10px}.metric{min-height:72px;display:flex;align-items:center;justify-content:space-between}.metric strong{margin:0}}
  </style>
</head>
<body><div class="app"><aside class="side" aria-label="Navegação principal"><a class="brand" href="index.html"><span class="brand-icon"><i class="bi bi-mortarboard-fill"></i></span>alume</a><nav><div class="nav-title">Menu</div><a class="nav-link active" href="index.html"><i class="bi bi-grid-1x2"></i><span>Dashboard</span></a><a class="nav-link" href="agenda.html"><i class="bi bi-calendar3"></i><span>Minha agenda</span></a><a class="nav-link" href="login.html"><i class="bi bi-box-arrow-in-right"></i><span>Login</span></a></nav></aside><main><section class="detail-card"><a class="back" href="index.html"><i class="bi bi-arrow-left me-1"></i>Minhas disciplinas</a><h1 class="course-title">Lógica de programação</h1><p class="subtitle">Detalhamento de frequência</p><div class="percent"><strong>92%</strong><span>Frequência atual</span></div><div class="metrics"><article class="metric"><span>Total de aulas</span><strong>72</strong></article><article class="metric"><span>Quantidade de faltas</span><strong>8</strong></article><article class="metric"><span>Faltas restantes</span><strong>10</strong></article></div></section></main></div></body>
</html>
