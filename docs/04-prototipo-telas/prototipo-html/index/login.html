<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#171717">
  <title>Alume — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--green:#16a34a;--line:#373737}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.login-card{width:min(850px,100%);min-height:575px;border:1px solid #eee;border-radius:28px;padding:72px 9% 64px;display:flex;flex-direction:column;align-items:center}.brand{font-size:2.35rem;font-weight:600;letter-spacing:.06em;color:var(--green);margin:0}.tagline{font-size:1.22rem;text-align:center;margin-top:4px}.login-form{width:min(610px,100%);margin-top:75px}.form-control{color:#fff;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 6px;font-size:.98rem;box-shadow:none!important}.form-control::placeholder{color:#eee;opacity:1}.form-control:focus{background:transparent;color:#fff;border-color:var(--green)}.enter{margin:63px auto 0;display:block;width:min(314px,100%);height:70px;border-radius:17px;border:1px solid var(--green);background:var(--green);color:#fff;font-size:1.38rem;font-weight:400}.enter:hover,.enter:focus{background:#15803d;border-color:#15803d;color:#fff}.notice{margin-top:16px;font-size:.85rem;color:#ddd;min-height:22px;text-align:center}@media(max-width:600px){.login-card{min-height:540px;padding:60px 8%}.brand{font-size:2rem}.tagline{font-size:1rem}.login-form{margin-top:68px}.enter{margin-top:52px;height:62px}}
  </style>
</head>
<body>
  <main class="login-card" aria-labelledby="page-title"><header class="text-center"><h1 class="brand" id="page-title">ALUME</h1><p class="tagline mb-0">Seu Gerenciador De Frequência Acadêmica</p></header><form class="login-form" id="loginForm"><div class="mb-2"><label class="visually-hidden" for="login">Login</label><input class="form-control" id="login" name="login" type="text" placeholder="Login" autocomplete="username" required></div><div><label class="visually-hidden" for="password">Senha</label><input class="form-control" id="password" name="password" type="password" placeholder="Senha" autocomplete="current-password" required></div><button class="btn enter" type="submit">ENTRAR</button><p class="notice" id="notice" role="status" aria-live="polite"></p></form></main>
  <script>document.getElementById('loginForm').addEventListener('submit',function(event){event.preventDefault();document.getElementById('notice').textContent='Protótipo de tela — autenticação não conectada.'})</script>
</body>
</html>
