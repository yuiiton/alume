<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#171717">
  <title>Alume — Minha agenda</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root{--green:#16a34a;--blue:#2563eb;--line:#383838}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:224px 1fr}.side{border-right:1px solid #252525;padding:28px 16px;display:flex;flex-direction:column;gap:34px;background:#090909}.brand{display:flex;align-items:center;gap:10px;color:white;text-decoration:none;font-size:1.15rem;font-weight:700;letter-spacing:-.04em}.brand-icon{display:grid;place-items:center;background:white;color:#171717;width:33px;height:33px;border-radius:9px}.nav-title{color:#777;text-transform:uppercase;font-size:.66rem;letter-spacing:.12em;padding:0 11px;margin-bottom:8px}.side .nav-link{color:#aaa;border-radius:9px;display:flex;align-items:center;gap:11px;padding:11px;font-size:.87rem}.side .nav-link:hover,.side .nav-link.active{color:#fff;background:#1d1d1d}.side .nav-link.active{box-shadow:inset 2px 0 var(--green)}main{padding:clamp(22px,5vw,58px)}.calendar-card{max-width:1000px;min-height:570px;border:1px solid #eee;border-radius:28px;margin:auto;padding:30px clamp(20px,5vw,60px) 55px}.calendar-card h1{font-size:1.75rem;font-weight:600;letter-spacing:-.03em;margin:0 0 42px}.month-row{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center;margin-bottom:26px}.month-name{font-size:1.1rem;font-weight:500}.month-row button{border:0;background:none;color:white;font-size:1.1rem;padding:8px}.week{display:grid;grid-template-columns:repeat(5,minmax(60px,1fr));gap:8px;margin:0 auto 17px;max-width:800px}.day{border:0;background:transparent;color:#fff;border-radius:16px;min-height:77px;display:grid;place-content:center;gap:5px;font-size:.92rem}.day span:first-child{font-size:.78rem}.day:hover{background:#161616}.day.selected{background:#2563eb}.agenda-day{max-width:800px;margin:auto}.day-name{font-size:.95rem;margin:12px 0 6px}.class-item{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid #414141}.class-item:last-child{border-bottom:0}.time{font-size:.88rem;white-space:nowrap}.class-name{font-weight:550;font-size:.97rem}.room{color:#bbb;font-size:.85rem;margin-top:12px}.mobile-nav{display:none}
    @media(max-width:760px){.app{display:block}main{padding:18px 12px 88px}.side{position:fixed;z-index:3;left:0;right:0;bottom:0;height:68px;border:0;border-top:1px solid #292929;padding:6px 10px;display:block}.brand,.nav-title{display:none}.side nav{height:100%;display:flex;justify-content:space-around;align-items:center}.side .nav-link{display:grid;justify-items:center;gap:2px;font-size:.64rem;padding:7px 12px}.side .nav-link.active{box-shadow:inset 0 2px var(--green)}.calendar-card{border-radius:21px;padding:25px 18px;min-height:560px}.calendar-card h1{font-size:1.5rem;margin-bottom:37px}.month-row{margin-bottom:22px}.week{gap:2px}.day{min-height:66px;border-radius:13px;font-size:.85rem}.class-item{grid-template-columns:90px 1fr;gap:8px}}
  </style>
</head>
<body>
  <div class="app"><aside class="side" aria-label="Navegação principal"><a class="brand" href="index.html"><span class="brand-icon"><i class="bi bi-mortarboard-fill"></i></span>alume</a><nav><div class="nav-title">Menu</div><a class="nav-link" href="index.html"><i class="bi bi-grid-1x2"></i><span>Dashboard</span></a><a class="nav-link active" href="agenda.html" aria-current="page"><i class="bi bi-calendar3"></i><span>Minha agenda</span></a><a class="nav-link" href="login.html"><i class="bi bi-box-arrow-in-right"></i><span>Login</span></a></nav></aside>
    <main><section class="calendar-card" aria-labelledby="agendaTitle"><h1 id="agendaTitle">Minha semana</h1><div class="month-row"><button type="button" aria-label="Semana anterior" onclick="changeWeek(-1)"><i class="bi bi-chevron-left"></i></button><div class="month-name" id="monthLabel">Novembro de 2026</div><button type="button" aria-label="Próxima semana" onclick="changeWeek(1)"><i class="bi bi-chevron-right"></i></button></div><div class="week" id="week" role="group" aria-label="Dias da semana"></div><section class="agenda-day" aria-live="polite"><h2 class="day-name" id="dayLabel">Segunda-feira</h2><div id="classes"><article class="class-item"><div class="time">18:00 - 18:40</div><div><div class="class-name">Lógica de programação</div><div class="room">Lab 10</div></div></article><article class="class-item"><div class="time">18:40 - 19:20</div><div><div class="class-name">Administração</div><div class="room">Sala 12</div></div></article></div></section></section></main></div>
  <script>
    const days=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];let monday=new Date(2026,10,16);let selected=0;function drawWeek(){const week=document.getElementById('week');week.innerHTML='';document.getElementById('monthLabel').textContent=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(monday).replace(/^./,c=>c.toUpperCase()).replace(' de ',' de ');for(let i=0;i<5;i++){const date=new Date(monday);date.setDate(monday.getDate()+i);const button=document.createElement('button');button.type='button';button.className='day'+(i===selected?' selected':'');button.setAttribute('aria-pressed',i===selected?'true':'false');button.innerHTML='<span>'+days[date.getDay()]+'</span><span>'+date.getDate()+'</span>';button.onclick=()=>{selected=i;drawWeek();document.getElementById('dayLabel').textContent=new Intl.DateTimeFormat('pt-BR',{weekday:'long'}).format(date).replace(/^./,c=>c.toUpperCase());document.getElementById('classes').innerHTML=i===0?'<article class="class-item"><div class="time">18:00 - 18:40</div><div><div class="class-name">Lógica de programação</div><div class="room">Lab 10</div></div></article><article class="class-item"><div class="time">18:40 - 19:20</div><div><div class="class-name">Administração</div><div class="room">Sala 12</div></div></article>':'<p class="text-secondary mt-4">Nenhuma aula cadastrada para este dia.</p>'};week.appendChild(button)}}function changeWeek(offset){monday.setDate(monday.getDate()+offset*7);selected=0;drawWeek();document.getElementById('dayLabel').textContent=new Intl.DateTimeFormat('pt-BR',{weekday:'long'}).format(monday).replace(/^./,c=>c.toUpperCase())}drawWeek();
  </script>
</body>
</html>
